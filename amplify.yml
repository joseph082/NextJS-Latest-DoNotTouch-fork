version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - ./patch-next.sh
    build:
      commands:
        - npm run build
        # Delete dev runtimes and source maps
        - find node_modules/next/dist/compiled/next-server -type f -name '*.runtime.dev.js*' -delete
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
